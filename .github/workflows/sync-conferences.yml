name: Sync 2026 CCF-A Conference Catalog

on:
  schedule:
    # Monday 04:17 UTC / Monday 12:17 Asia/Taipei.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-2026-ccf-a-conferences
  cancel-in-progress: false

jobs:
  sync-and-propose:
    name: Sync, validate, and open update PR
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout default branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore observations from an open bot branch
        shell: bash
        run: |
          bot_ref="refs/remotes/origin/automation/update-2026-conference-catalog"
          if git show-ref --verify --quiet "$bot_ref"; then
            base_ref="$(git merge-base HEAD "$bot_ref")"
            mapfile -t observed_files < <(
              git diff --name-only --diff-filter=AM "$base_ref" "$bot_ref" -- 'data/conferences/2026/*.json'
            )
            if (( ${#observed_files[@]} > 0 )); then
              git restore --source="$bot_ref" -- "${observed_files[@]}"
            fi
          fi

      - name: Sync official conference sources
        run: npm run sync:conferences

      - name: Validate normalized conference data
        run: npm run check:conferences

      - name: Build static site
        run: npm run build

      - name: Create conference data pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.event.repository.default_branch }}
          branch: automation/update-2026-conference-catalog
          delete-branch: true
          add-paths: |
            data/conferences/2026/*.json
          commit-message: |
            chore: Update 2026 CCF-A conference catalog

            chore: 更新 2026 CCF-A 会议目录
          title: 'chore: update 2026 CCF-A conference catalog'
          body: |
            Automated weekly refresh of the 2026 CCF-A conference catalog from configured official sources.

            Checks completed before this PR was opened:
            - normalized dataset validation
            - conference filter regression checks
            - full Astro production build

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Please review source additions, removals, presentation changes, and automatic classifications before merging.
