server {
    listen 80;
    listen [::]:80;
    server_name papers.chlience.com;

    root /var/www/papers/current;
    index index.html;

    access_log /var/log/nginx/papers.chlience.com.access.log;
    error_log /var/log/nginx/papers.chlience.com.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|svg|ico|xml|txt)$ {
        try_files $uri =404;
        expires 1h;
    }

    location ~* \.json$ {
        try_files $uri =404;
        expires 5m;
    }
}
