<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">PIPO overview: input-side compression, output-side drafting, and pair-in pair-out decoding</title>
  <desc id="desc">A redrawn overview comparing input-side latent compression, output-side multi-token prediction, and PIPO's symmetric pair-in pair-out interface.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8f5; }
      .panel { fill: #ffffff; stroke: #cfd6cc; stroke-width: 2; rx: 12; }
      .panel-title { font: 700 24px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #22302a; }
      .label { font: 600 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #22302a; }
      .small { font: 500 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #42514a; }
      .tiny { font: 500 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5a6961; }
      .token { fill: #e7eef6; stroke: #7b97b5; stroke-width: 1.5; rx: 8; }
      .latent { fill: #e9f3e5; stroke: #7ca16d; stroke-width: 1.5; rx: 8; }
      .draft { fill: #fff0d8; stroke: #c99b45; stroke-width: 1.5; rx: 8; }
      .accept { fill: #f0e7f4; stroke: #9b78ad; stroke-width: 1.5; rx: 8; }
      .box { fill: #ffffff; stroke: #94a39a; stroke-width: 1.5; rx: 10; }
      .arrow { stroke: #56645d; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #7b8790; stroke-width: 2; stroke-dasharray: 6 6; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#56645d"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="520"/>
  <text x="60" y="50" class="panel-title">Pair-In, Pair-Out overview</text>
  <text x="60" y="78" class="small">PIPO joins latent compression on the input side with multi-token prediction on the output side.</text>

  <rect class="panel" x="55" y="115" width="330" height="330"/>
  <text x="85" y="150" class="label">Input-side methods</text>
  <text x="85" y="174" class="small">Compress history into fewer slots.</text>
  <rect class="token" x="85" y="210" width="56" height="38"/>
  <text x="106" y="234" class="small">x1</text>
  <rect class="token" x="150" y="210" width="56" height="38"/>
  <text x="171" y="234" class="small">x2</text>
  <rect class="token" x="215" y="210" width="56" height="38"/>
  <text x="236" y="234" class="small">x3</text>
  <rect class="token" x="280" y="210" width="56" height="38"/>
  <text x="301" y="234" class="small">x4</text>
  <path class="arrow" d="M210 270 C210 300 210 318 210 342"/>
  <rect class="box" x="130" y="342" width="160" height="52"/>
  <text x="159" y="374" class="small">latent compressor</text>
  <path class="arrow" d="M210 394 C210 413 210 420 210 430"/>
  <rect class="latent" x="122" y="430" width="176" height="38"/>
  <text x="162" y="454" class="small">fewer latent slots</text>

  <rect class="panel" x="435" y="115" width="330" height="330"/>
  <text x="465" y="150" class="label">Output-side methods</text>
  <text x="465" y="174" class="small">Draft extra tokens after one step.</text>
  <rect class="box" x="505" y="215" width="190" height="54"/>
  <text x="553" y="248" class="small">backbone step</text>
  <path class="arrow" d="M600 269 L600 308"/>
  <rect class="token" x="505" y="308" width="84" height="44"/>
  <text x="534" y="336" class="small">yb</text>
  <rect class="draft" x="610" y="308" width="84" height="44"/>
  <text x="638" y="336" class="small">yd</text>
  <path class="dash" d="M652 353 C652 380 652 393 652 420"/>
  <rect class="box" x="556" y="420" width="190" height="42"/>
  <text x="586" y="446" class="small">verifier or confidence</text>

  <rect class="panel" x="815" y="115" width="330" height="330"/>
  <text x="845" y="150" class="label">PIPO</text>
  <text x="845" y="174" class="small">Pair-in compression and pair-out drafting.</text>
  <rect class="token" x="850" y="210" width="52" height="36"/>
  <text x="868" y="233" class="small">x1</text>
  <rect class="token" x="910" y="210" width="52" height="36"/>
  <text x="928" y="233" class="small">x2</text>
  <path class="arrow" d="M966 228 L995 228"/>
  <rect class="latent" x="1002" y="210" width="90" height="36"/>
  <text x="1028" y="233" class="small">z1</text>
  <path class="arrow" d="M1047 247 L1047 285"/>
  <rect class="box" x="966" y="285" width="162" height="48"/>
  <text x="1000" y="315" class="small">backbone</text>
  <path class="arrow" d="M1047 333 L1047 370"/>
  <rect class="token" x="910" y="370" width="72" height="40"/>
  <text x="932" y="395" class="small">yb</text>
  <rect class="draft" x="1002" y="370" width="72" height="40"/>
  <text x="1024" y="395" class="small">yd</text>
  <rect class="accept" x="1092" y="370" width="34" height="40"/>
  <text x="1100" y="395" class="small">c</text>
  <path class="dash" d="M1038 410 C1005 430 962 438 923 436"/>
  <text x="850" y="454" class="tiny">accept: next pair = (yb, yd)</text>
  <text x="850" y="474" class="tiny">reject: next pair = (yb, PAD)</text>
</svg>
