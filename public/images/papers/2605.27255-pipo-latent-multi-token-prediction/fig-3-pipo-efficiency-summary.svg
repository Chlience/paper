<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">PIPO efficiency summary across input lengths</title>
  <desc id="desc">A redrawn efficiency summary showing PIPO's time-to-first-token and time-per-output-token improvements at 2K and 128K input lengths.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8f5; }
      .panel { fill: #ffffff; stroke: #cfd6cc; stroke-width: 2; rx: 14; }
      .title { font: 700 24px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #22302a; }
      .subtitle { font: 500 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #53625a; }
      .label { font: 700 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #22302a; }
      .small { font: 500 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4f5d56; }
      .axis { stroke: #83918a; stroke-width: 1.5; }
      .regular { fill: #8aa8c4; }
      .pipo { fill: #86b47b; }
      .speed { fill: #f0e7f4; stroke: #9b78ad; stroke-width: 1.5; rx: 12; }
      .legend { font: 600 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #29372f; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="520"/>
  <text x="60" y="50" class="title">Efficiency summary</text>
  <text x="60" y="76" class="subtitle">Lower bars are faster. PIPO gains TTFT from pair-in compression and TPOT from pair-out decoding.</text>

  <rect class="panel" x="55" y="115" width="520" height="335"/>
  <text x="85" y="150" class="label">TTFT, seconds</text>
  <line class="axis" x1="110" y1="385" x2="520" y2="385"/>
  <line class="axis" x1="110" y1="185" x2="110" y2="385"/>
  <rect class="regular" x="160" y="383" width="44" height="2"/>
  <rect class="pipo" x="214" y="384" width="44" height="1"/>
  <text x="143" y="413" class="small">2K</text>
  <text x="146" y="433" class="small">0.139 -> 0.084</text>
  <rect class="regular" x="360" y="185" width="44" height="200"/>
  <rect class="pipo" x="414" y="309" width="44" height="76"/>
  <text x="352" y="413" class="small">128K</text>
  <text x="344" y="433" class="small">20.3 -> 7.69</text>
  <rect class="speed" x="177" y="200" width="110" height="42"/>
  <text x="204" y="226" class="legend">1.65x</text>
  <rect class="speed" x="390" y="200" width="110" height="42"/>
  <text x="417" y="226" class="legend">2.64x</text>

  <rect class="panel" x="625" y="115" width="520" height="335"/>
  <text x="655" y="150" class="label">TPOT, lower is faster</text>
  <line class="axis" x1="680" y1="385" x2="1090" y2="385"/>
  <line class="axis" x1="680" y1="185" x2="680" y2="385"/>
  <rect class="regular" x="735" y="197" width="44" height="188"/>
  <rect class="pipo" x="789" y="294" width="44" height="91"/>
  <text x="724" y="413" class="small">2K</text>
  <text x="713" y="433" class="small">26.3 -> 12.7</text>
  <rect class="regular" x="935" y="185" width="44" height="200"/>
  <rect class="pipo" x="989" y="284" width="44" height="101"/>
  <text x="927" y="413" class="small">128K</text>
  <text x="914" y="433" class="small">27.9 -> 14.1</text>
  <rect class="speed" x="753" y="200" width="110" height="42"/>
  <text x="780" y="226" class="legend">2.07x</text>
  <rect class="speed" x="960" y="200" width="110" height="42"/>
  <text x="987" y="226" class="legend">1.98x</text>

  <rect class="regular" x="430" y="470" width="18" height="18"/>
  <text x="456" y="484" class="legend">Regular</text>
  <rect class="pipo" x="540" y="470" width="18" height="18"/>
  <text x="566" y="484" class="legend">PIPO</text>
  <text x="720" y="484" class="small">Values redrawn from the paper's efficiency analysis.</text>
</svg>
